name: Coverage

on:
  pull_request:

jobs:
  coverage:
    name: Test & Coverage
    runs-on: ubuntu-latest
    env:
      # Exposed through env so the upload step can test for it: the secrets
      # context is not available in step-level if conditions. Forks have no
      # CODECOV_TOKEN, and Codecov rejects tokenless uploads for a repository
      # it has never been activated for, so the step is skipped there instead
      # of failing the build.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: .go-version
          cache: true

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: internal/gui/frontend/package-lock.json

      - uses: extractions/setup-just@v3

      - name: Install frontend dependencies
        working-directory: internal/gui/frontend
        run: npm ci

      - name: Build frontend (required for go:embed in internal/gui)
        working-directory: internal/gui/frontend
        run: npm run build

      - name: Run tests with coverage
        run: just coverage

      # fail_ci_if_error stays true so that a configured token which fails to
      # upload still breaks the build; only the "no token at all" case is skipped.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: true
