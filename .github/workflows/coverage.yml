name: Coverage

on:
  pull_request:

jobs:
  coverage:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: .go-version
          cache: true

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: internal/gui/frontend/package-lock.json

      - uses: extractions/setup-just@v3

      - name: Install frontend dependencies
        working-directory: internal/gui/frontend
        run: npm ci

      - name: Build frontend (required for go:embed in internal/gui)
        working-directory: internal/gui/frontend
        run: npm run build

      # `just coverage` prints a per-function coverage table, which is all this
      # repository needs. There is deliberately no Codecov upload step: it needs
      # a per-repository token, its tokenless policy changes out from under
      # forks, and codecov.yml ignores cmd/** — the part of the tree this fork
      # actually changes. codecov.yml itself is kept so the thresholds stay
      # documented if the upload is ever wired back up.
      - name: Run tests with coverage
        run: just coverage
